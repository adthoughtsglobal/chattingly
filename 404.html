<!DOCTYPE html>
<html>
<head>
  <title>404 - Page Not Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 48px;
      color: #ff4040;
      margin-bottom: 20px;
    }

    p {
      font-size: 24px;
      color: #333;
      margin-bottom: 40px;
    }

    .emoji {
      font-size: 72px;
    }

    .back-btn {
      font-size: 16px;
      color: #fff;
      background-color: #4c9aff;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .back-btn:hover {
      background-color: #3366ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Oops!</h1>
    <p>Looks like you took a wrong turn.</p>
    <p class="emoji">¯\_(ツ)_/¯</p>
    <p>Don't worry, it happens to the best of us.</p>
    <a href="/" class="back-btn">Go Back Home</a>
  </div>
</body>
</html>
