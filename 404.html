<!DOCTYPE html>
<html>
<head>
  <title>404 - Page Not Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 48px;
      color: #ff4040;
      margin-bottom: 20px;
    }

    p {
      font-size: 24px;
      color: #333;
      margin-bottom: 40px;
    }

    .emoji {
      font-size: 72px;
    }

    .joke {
      font-size: 20px;
      color: #666;
      margin-bottom: 40px;
    }

    .back-btn {
      font-size: 16px;
      color: #fff;
      background-color: #4c9aff;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .back-btn:hover {
      background-color: #3366ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Oops!</h1>
    <p>Looks like you wandered into the wrong neighborhood.</p>
    <p class="emoji">¯\_(ツ)_/¯</p>
    <p class="joke" id="joke"></p>
    <a href="/" class="back-btn">Can't bear these jokes, Take Me Home</a>
  </div>

  <script>
    function getRandomJoke() {
      const jokeElement = document.getElementById('joke');
      const jokes = [
        "Why did the web developer go broke?\nBecause they lost their domain!",
        "Why don't scientists trust atoms?\nBecause they make up everything!",
        "What's the best thing about Switzerland?\nI don't know, but the flag is a big plus!",
        "Why did the scarecrow win an award?\nBecause he was outstanding in his field!"
      ];
      const randomIndex = Math.floor(Math.random() * jokes.length);
      jokeElement.textContent = jokes[randomIndex];
    }

    window.addEventListener('DOMContentLoaded', getRandomJoke);
  </script>
</body>
</html>
